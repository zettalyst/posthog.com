name: Deploy ko-i18n to Cloudflare Pages

on:
    push:
        branches: [ko-i18n]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=16384'

            - name: Strip docs and source maps to fit CF Pages 20k file limit
              run: |
                  rm -rf public/docs public/page-data/docs
                  find public -name '*.map' -delete
                  find public -name '*.LICENSE.txt' -delete
                  echo "File count: $(find public -type f | wc -l)"

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy public --project-name=posthog-ko-preview --branch=main --commit-dirty=true
